name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Verify Changesets App secrets
        run: |
          if [ -z "$CHANGESETS_APP_ID" ] || [ -z "$CHANGESETS_APP_PRIVATE_KEY" ]; then
            echo "::error::CHANGESETS_APP_ID and CHANGESETS_APP_PRIVATE_KEY secrets must both be set. See docs/releasing.md > One-Time Setup > GitHub."
            exit 1
          fi
        env:
          CHANGESETS_APP_ID: ${{ secrets.CHANGESETS_APP_ID }}
          CHANGESETS_APP_PRIVATE_KEY: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}

      - name: Mint Changesets App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CHANGESETS_APP_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
